spring.application.name=certichain-server
# Cloud hosts (Render, Railway, Heroku) pass the port in $PORT
server.port=${PORT:8080}
# Behind a hosting proxy: trust X-Forwarded-Proto/Host so links and QR codes use https://
server.forward-headers-strategy=native
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# JSP views live in src/main/webapp/WEB-INF/jsp
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Shared with the Swing desktop client. AUTO_SERVER lets both processes open the file at once.
spring.datasource.url=jdbc:h2:file:${user.home}/certichain-data/certichain;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# Spring Boot Actuator: health + info endpoints for monitoring (cloud-ready service)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=CertiChain
info.app.description=Tamper-evident academic credential registry
info.app.version=1.0.0

# Ledger watchdog: re-audits the whole chain in the background
certichain.watchdog.interval-ms=60000
# Issues a set of demo certificates the first time the database is empty
certichain.seed-demo=true
# Passwords of the two accounts created on first start. Set ADMIN_PASSWORD and
# REGISTRAR_PASSWORD on any public deployment.
certichain.admin-password=${ADMIN_PASSWORD:admin123}
certichain.registrar-password=${REGISTRAR_PASSWORD:registrar123}
# Lists those default accounts on the login page; turn off on a public deployment
certichain.show-demo-accounts=${SHOW_DEMO_ACCOUNTS:true}

logging.level.com.certichain=INFO
